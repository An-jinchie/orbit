<style>
/* Layout: one narrow column, phone first. Home -> set (tabs) -> review. Palette from H&E staining: hematoxylin violet-blue, eosin pink. */
:root{
  --bg:#f7f4f8; --surface:#ffffff; --ink:#241b3a; --muted:#6a627d; --line:#e2dbe9;
  --hema:#4a3a8c; --on-hema:#ffffff; --eosin:#d4466f; --ok:#217a58; --bad:#b8324f; --tint:#efeaf7;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111d; --surface:#1f1a2b; --ink:#ece7f5; --muted:#a79fbb; --line:#332c44;
  --hema:#a99cf3; --on-hema:#15111d; --eosin:#f27fa1; --ok:#5fd1a2; --bad:#f0889d; --tint:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111d; --surface:#1f1a2b; --ink:#ece7f5; --muted:#a79fbb; --line:#332c44;
  --hema:#a99cf3; --on-hema:#15111d; --eosin:#f27fa1; --ok:#5fd1a2; --bad:#f0889d; --tint:#2a2340; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-inline:16px;padding-block:14px 40px}
#app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.01em} h2{font-size:21px} h3{font-size:16px}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:3px solid var(--hema);position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-3px;width:34%;height:3px;background:var(--eosin)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{font:500 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.pill.hot{color:var(--hema);border-color:var(--hema)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--hema);color:var(--on-hema);border:1px solid var(--hema);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--hema)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--hema);padding:6px 0;font-weight:600;text-align:left}
label{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:120px;line-height:1.45}
input[type=file]{font-size:14px;max-width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)} .small{font-size:13px}
.big{font:700 40px/1 var(--display)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:left;min-width:0}
.item>div{min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--tint);color:var(--hema);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.week{display:flex;gap:8px;align-items:flex-end;height:64px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.week i{display:block;width:100%;background:var(--hema);border-radius:4px 4px 0 0;min-height:3px;opacity:.9}
.week i.zero{background:var(--line)}
.week span{font:500 11px var(--mono);color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--hema);border-bottom-color:var(--eosin)}
.prose p{margin-bottom:8px} .prose ul{margin:0 0 8px;padding-left:20px} .prose li{margin-bottom:3px}
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 20px/1.35 var(--display);padding:24px 18px;cursor:pointer;overflow-wrap:anywhere;user-select:none}
.flash .a{color:var(--hema)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--eosin)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.rate small{font:500 11px var(--mono);color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;overflow-wrap:anywhere}
.opt b{font:500 13px var(--mono);color:var(--muted);padding-top:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{padding:10px 12px;border-radius:12px;max-width:92%;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--hema);color:var(--on-hema)}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bub p:last-child,.bub ul:last-child{margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--tint);color:var(--hema);border:0;border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:13px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.tile.sel{border-color:var(--hema);background:var(--tint)}
.tile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.tile.done{visibility:hidden}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:10px;padding:8px 12px;font-size:14px}
.err{color:var(--bad);font-size:14px}
.okmsg{color:var(--ok);font-size:14px}
.brand{display:flex;align-items:center;gap:8px}
.authform{display:flex;flex-direction:column;gap:14px}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;max-width:100%}
.radio{display:flex;gap:16px;flex-wrap:wrap}
.radio label{display:flex;gap:6px;align-items:center;font-weight:500}
.script{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cardrow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cardrow>div{min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var DAY=864e5, LS='orbit.v1.anon';
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cut(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function fmt(ms){var m=ms/60000;if(m<60)return Math.max(1,Math.round(m))+'m';var h=m/60;if(h<24)return Math.round(h)+'h';var d=h/24;if(d<30)return Math.round(d)+'d';return (d/30).toFixed(1).replace('.0','')+'mo'}
function md(s){return esc(s).split('\n').map(function(l){if(/^\s*[-*] /.test(l))return '<li>'+l.replace(/^\s*[-*] /,'')+'</li>';return l.trim()?'<p>'+l+'</p>':''}).join('').replace(/(<li>.*?<\/li>)+/g,function(m){return '<ul>'+m+'</ul>'}).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}

/* ---------- scheduling: FSRS-5 with default weights, 90% target retention ---------- */
var W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
var DECAY=-0.5, FACTOR=19/81, RET=0.9;

function retr(t,s){return Math.pow(1+FACTOR*t/s,DECAY)}
function ivlDays(s){return clamp(Math.round(s/FACTOR*(Math.pow(RET,1/DECAY)-1)),1,36500)}

}
function sched(c,r,now){
  now=now||Date.now(); ensureFsrs(c);
  var g=r+1, reps=c.reps||0, lapses=c.lapses||0, s, d;
  if(!c.s){s=W[g-1];d=d0(g)}

    var t=Math.max(0,(now-c.last)/DAY), s0=c.s, dOld=c.d, R=retr(t,s0);

    if(t<1)s=s0*Math.exp(W[17]*(g-3+W[18]));
    else if(g===1)s=Math.min(s0,W[11]*Math.pow(dOld,-W[12])*(Math.pow(s0+1,W[13])-1)*Math.exp((1-R)*W[14]));

  s=Math.max(0.01,s);
  return {s:s,d:d,last:now,reps:reps+1,lapses:lapses,due:g===1?now+600000:now+ivlDays(s)*DAY};
}
function newCard(q,a){return {id:uid(),q:q,a:a,due:0,s:0,d:0,last:0,reps:0,lapses:0}}

/* ---------- state ---------- */
function seed(){
  var cards=[
    ['How long does a normal adult red blood cell circulate?','About 120 days.'],
    ['Which stain is routinely used for blood films?','Wright-Giemsa, a Romanowsky stain.'],
    ['Which white cell is most abundant in adult blood?','Neutrophils, about 50–70% of white cells.'],
    ['What is a reticulocyte?','An immature red cell with leftover RNA. Shown with supravital stains such as new methylene blue.'],
    ['Which anticoagulant is used for a full blood count tube?','EDTA (lavender top).'],
    ['What does MCV measure?','Mean corpuscular volume: the average size of red cells, in fL.']
  ].map(function(x,i){var c=newCard(x[0],x[1]);c.id='ex'+i;return c});
  return {v:1,streak:{count:0,last:''},reviewed:{},sets:[{
    id:'example1',example:true,title:'Hematology basics',created:Date.now(),
    summary:'- Red cells live about 120 days and carry oxygen on hemoglobin.\n- Blood films are stained with a Romanowsky stain such as Wright-Giemsa.\n- Neutrophils are the most common white cell.\n- Reticulocytes are young red cells; count them with a supravital stain.\n- Use EDTA for a full blood count so cell shape is preserved.',
    notes:'Red blood cells (erythrocytes) circulate for about 120 days. Blood films are stained with Wright-Giemsa. Neutrophils make up roughly 50-70% of circulating white cells. Reticulocytes are immature red cells containing residual RNA and are demonstrated with new methylene blue. Full blood count samples are collected in EDTA. MCV is the mean corpuscular volume in fL.',
    cards:cards,
    quiz:[
      {q:'A full blood count sample is collected into which additive?',options:['EDTA','Sodium citrate','Fluoride oxalate','No additive (plain tube)'],answer:0,why:'EDTA keeps cells intact for counting. Citrate is used for coagulation tests.'},
      {q:'A raised MCV suggests which kind of red cells?',options:['Microcytic','Macrocytic','Normocytic','Hypochromic'],answer:1,why:'MCV above the reference range means larger than normal red cells.'},
      {q:'Reticulocytes are best shown with which kind of stain?',options:['Gram stain','Supravital stain (new methylene blue)','Ziehl-Neelsen','PAS'],answer:1,why:'Supravital stains precipitate the residual RNA in young red cells.'}
    ],best:{}
  }]};
}
function load(){try{var t=localStorage.getItem(LS);if(t){var d=JSON.parse(t);if(d&&Array.isArray(d.sets))return d}}catch(e){}return null}
function norm(d){d=JSON.parse(JSON.stringify(d));d.sets=d.sets||[];d.streak=d.streak||{count:0,last:''};d.reviewed=d.reviewed||{};d.sets.forEach(function(s){s.cards=(s.cards||[]).map(ensureFsrs);s.quiz=s.quiz||[];s.best=s.best||{};s.notes=s.notes||''});return d}
var S=null;
var V={name:'loading'}, R=null, Z=null, M=null, T={}, ctl=null, timerId=null;
var sb=null, user=null, cloudReady=false, recovering=false, syncState='local', touched=false;
var imgOK=true, imgTypes=['image/jpeg','image/png','image/webp'];
var pendingImg=null, saveTimer=null, saving=false, dirty=false;
var AUTH='login', authMsg=null, authBusy=false;
var LOGO='<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="9" style="fill:none;stroke:var(--hema);stroke-width:2"/><circle cx="14" cy="14" r="3.2" style="fill:var(--hema)"/><circle cx="22" cy="9.5" r="3" style="fill:var(--eosin)"/></svg>';
var DEFAULT_STYLE='Explain things clearly in plain English. Start with the answer, then give the reasoning with a concrete example. Keep answers short. Quiz me or ask me to explain it back when I ask. Be precise about what is known and what is not, and never inflate.', PREFILL=null;
function defStyle(){return PREFILL||DEFAULT_STYLE}

function persist(){
  touched=true; if(S)S.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!sb||!user||!cloudReady)return; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
function flush(){
  if(!sb||!user||!cloudReady||!dirty)return Promise.resolve();
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return Promise.resolve()}
  saving=true;dirty=false;
  var row={user_id:user.id,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()};
  return sb.from('libraries').upsert(row).then(function(r){return r&&r.error?Promise.reject(r.error):null}).then(function(){syncState='synced'},function(){syncState='error';dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,8000)}).then(function(){saving=false;renderStatus();if(dirty&&syncState==='synced'){clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}});
}
function renderStatus(){
  var el=$('#sync'); if(!el)return;
  el.textContent=syncState==='synced'?'Saved to your account':syncState==='error'?'Could not sync. Retrying. Your changes are kept on this device.':'Saving…';
}
function loadLibrary(){
  syncState='local';cloudReady=false;
  return sb.from('libraries').select('data').eq('user_id',user.id).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    var cloud=(r.data&&r.data.data&&Array.isArray(r.data.data.sets))?r.data.data:null, local=load(), pick=cloud;
    if(local&&(!cloud||(local.savedAt||0)>(cloud.savedAt||0)))pick=local;
    S=norm(pick||seed()); cloudReady=true;
    if(!S.savedAt)S.savedAt=Date.now();
    syncState=(cloud&&pick===cloud)?'synced':'local';
    if(pick!==cloud){dirty=true;flush()}
  });
}
function fetchPrefill(){
  if(PREFILL!==null)return Promise.resolve();
  return sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(!s)return;return fetch('/api/persona',{headers:{Authorization:'Bearer '+s.access_token}}).then(function(x){return x.json()}).then(function(b){PREFILL=(b&&typeof b.style==='string')?b.style:''})}).catch(function(){PREFILL=''});
}
function enter(){
  V={name:'loading'};render();
  loadLibrary().then(function(){return S.profile?null:fetchPrefill()}).then(function(){V=S.profile?{name:'home'}:{name:'welcome'};render()}).catch(function(){V={name:'loaderr'};render()});
}
function handleSession(session,ev){
  if(ev==='PASSWORD_RECOVERY'){recovering=true;AUTH='reset';V={name:'auth'};render();return}
  if(recovering&&session)return;
  if(!session){user=null;S=null;cloudReady=false;clearTimeout(saveTimer);if(AUTH==='reset')AUTH='login';V={name:'auth'};render();return}
  if(user&&user.id===session.user.id){user=session.user;return}
  user=session.user;LS='orbit.v1.'+user.id;AUTH='login';authMsg=null;enter();
}
function byId(id){return S?S.sets.filter(function(s){return s.id===id})[0]:undefined}
function dueCount(sid){var n=Date.now(),k=0;S.sets.forEach(function(s){if(sid&&s.id!==sid)return;s.cards.forEach(function(c){if(c.due<=n)k++})});return k}
function streakNow(){var l=S.streak.last;return (l===dayKey(new Date())||l===dayKey(new Date(Date.now()-DAY)))?S.streak.count:0}
function markStudied(n){var t=dayKey(new Date()),y=dayKey(new Date(Date.now()-DAY)),s=S.streak;if(s.last!==t){s.count=s.last===y?s.count+1:1;s.last=t}S.reviewed[t]=(S.reviewed[t]||0)+n}

/* ---------- AI ---------- */
function status(msg,stop){var el=$('#aistatus');if(!el)return;el.innerHTML=msg?'<div class="status"><span>'+esc(msg)+'</span>'+(stop?'<button class="btn sm ghost" data-act="stop">Stop</button>':'')+'</div>':''}
function aiErr(e){var c=e&&e.code;return ({session_expired:'Your session ended. Log in again.',rate_limited:'You have reached today’s AI limit. It resets at midnight UTC.',provider_busy:'The AI service is busy. Wait a minute and try again.',not_configured:'AI is not set up on this site yet. Check the Vercel settings.',prompt_too_large:'That is too much text at once. Try a shorter section.',invalid_json:'The AI’s reply could not be read. Try again.',refused:'The AI could not work with that input. Try different notes.',empty_completion:'The AI returned nothing. Try again.',image_rejected:'That image could not be used. Try a clearer photo.',network:'Could not reach the server. Check your connection.'})[c]||'Something went wrong with the AI. Try again.'}
function persona(){var p=S&&S.profile;return (p&&p.style!=null)?p.style:defStyle()}
function shrinkImage(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]})};im.onerror=function(){URL.revokeObjectURL(u);rej({code:'image_rejected'})};im.src=u})}
function callAI(messages,o){
  o=o||{};
  return sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session; if(!s)throw {code:'session_expired'};
    return (o.image?shrinkImage(o.image):Promise.resolve(null)).then(function(img){
      var p=(S&&S.profile)||{};
      return fetch('/api/ai',{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({mode:o.json?'json':'text',messages:messages,persona:persona(),profile:{name:p.name,course:p.course},image:img})});
    });
  }).then(function(res){

  '<div class="field"><label for="ps">How should Orbit teach you?</label><textarea id="ps" rows="8" style="min-height:170px">'+esc(p.style!=null?p.style:defStyle())+'</textarea><div class="muted small">The tutor, quizzes and audio lessons follow this. Change it any time.</div><div class="row"><button type="button" class="link" data-act="resetstyle">Reset to the default</button></div></div>'+
  '<div class="row"><button class="btn" data-act="welcomesave">'+(S.profile?'Save':'Start studying')+'</button></div><div id="aistatus"></div>';
}
function saveProfile(){
  var n=($('#pn').value||'').trim();
  if(!n){var e=$('#aistatus');if(e)e.innerHTML='<p class="err">Enter your name to continue.</p>';return}
  S.profile={name:n.slice(0,40),course:($('#pc').value||'').trim().slice(0,60),goal:+$('#pg').value||20,style:(($('#ps')||{}).value||'').trim().slice(0,1500),joined:(S.profile&&S.profile.joined)||Date.now()};
  persist();V={name:'home'};render();
}
function vLoading(){return '<header class="top"><h1 class="brand">'+LOGO+'Orbit</h1></header><p class="muted">Opening your library…</p>'}
function vSetup(){return '<header class="top"><h1 class="brand">'+LOGO+'Orbit</h1></header><section class="panel"><h3>Almost there</h3><p>This site is missing its Supabase settings. Add SUPABASE_URL and SUPABASE_ANON_KEY in Vercel, then redeploy.</p></section>'}
function vLoadErr(){return '<header class="top"><h1 class="brand">'+LOGO+'Orbit</h1></header><section class="panel"><h3>Could not open your library</h3><p class="muted">Check your connection, then try again. Your saved sets are safe.</p><div class="row"><button class="btn" data-act="retryload">Try again</button><button class="btn ghost" data-act="logout">Log out</button></div></section>'}
function authBox(){return authMsg?'<p class="'+(authMsg.k==='err'?'err':'okmsg')+'" role="alert">'+esc(authMsg.t)+'</p>':''}
function setAuthMsg(k,t){authMsg=t?{k:k,t:t}:null;var e=$('#authmsg');if(e)e.innerHTML=authBox()}
function authText(err){var m=(err&&err.message)||'';
  if(/invalid login/i.test(m))return 'Email or password is wrong.';
  if(/not confirmed/i.test(m))return 'Confirm your email first. Check your inbox for the link.';
  if(/already registered/i.test(m))return 'That email already has an account. Log in instead.';
  if(/rate limit|too many|seconds/i.test(m))return 'Too many attempts or emails. Wait a few minutes and try again.';
  return m||'Something went wrong. Try again.'}
function vAuth(){
  var m=AUTH, title={login:'Log in',signup:'Create your account',forgot:'Reset your password',reset:'Choose a new password'}[m], go={login:'Log in',signup:'Create account',forgot:'Send reset link',reset:'Save password'}[m], f='';
  if(m==='signup')f+='<div class="field"><label for="an">Your name</label><input type="text" id="an" autocomplete="given-name"></div>';
  if(m!=='reset')f+='<div class="field"><label for="ae">Email</label><input type="email" id="ae" autocomplete="email" inputmode="email"></div>';
  if(m!=='forgot')f+='<div class="field"><label for="ap">'+(m==='reset'?'New password':'Password')+'</label><input type="password" id="ap" autocomplete="'+(m==='login'?'current-password':'new-password')+'">'+(m==='login'?'':'<div class="muted small">At least 8 characters.</div>')+'</div>';
  var links={login:'<button type="button" class="link" data-act="authmode" data-m="signup">Create an account</button><button type="button" class="link" data-act="authmode" data-m="forgot">Forgot password?</button>',signup:'<button type="button" class="link" data-act="authmode" data-m="login">I already have an account</button>',forgot:'<button type="button" class="link" data-act="authmode" data-m="login">Back to log in</button>',reset:''}[m];
  return '<header class="top"><h1 class="brand">'+LOGO+'Orbit</h1></header><h2>'+title+'</h2>'+(m==='login'?'<p class="muted">Log in to open your library.</p>':'')+
    '<form id="authform" class="authform" novalidate>'+f+'<div id="authmsg">'+authBox()+'</div><div class="row"><button class="btn" type="submit" id="authgo">'+go+'</button></div></form><div class="row" style="justify-content:space-between">'+links+'</div>';
}
function doAuth(){
  if(authBusy||!sb)return;
  var em=(($('#ae')||{}).value||'').trim(), pw=($('#ap')||{}).value||'', nm=(($('#an')||{}).value||'').trim(), p;
  if(AUTH==='login'){if(!em||!pw)return setAuthMsg('err','Enter your email and password.');p=sb.auth.signInWithPassword({email:em,password:pw})}
  else if(AUTH==='signup'){if(!nm)return setAuthMsg('err','Enter your name.');if(!em)return setAuthMsg('err','Enter your email.');if(pw.length<8)return setAuthMsg('err','Use a password with at least 8 characters.');p=sb.auth.signUp({email:em,password:pw,options:{data:{name:nm.slice(0,40)},emailRedirectTo:location.origin}})}
  else if(AUTH==='forgot'){if(!em)return setAuthMsg('err','Enter your email.');p=sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin})}
  else{if(pw.length<8)return setAuthMsg('err','Use a password with at least 8 characters.');p=sb.auth.updateUser({password:pw})}
  authBusy=true;setAuthMsg('ok','Working…');
  p.then(function(r){
    authBusy=false;
    if(r.error)return setAuthMsg('err',authText(r.error));
    if(AUTH==='signup'){
      if(r.data&&r.data.session)return;
      if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)return setAuthMsg('err','That email already has an account. Log in instead.');
      AUTH='login';render();return setAuthMsg('ok','Account created. Check your email for a confirmation link, then log in.');
    }
    if(AUTH==='forgot'){AUTH='login';render();return setAuthMsg('ok','If that email has an account, a reset link is on its way.')}
    if(AUTH==='reset'){
      recovering=false;AUTH='login';
      return sb.auth.getSession().then(function(x){if(user&&S){V=S.profile?{name:'home'}:{name:'welcome'};render()}else handleSession(x.data&&x.data.session,'SIGNED_IN')});
    }
  }).catch(function(){authBusy=false;setAuthMsg('err','Could not reach the server. Check your connection.')});
}
function vReview(){
  if(!R||R.i>=R.q.length)return '<header class="top"><h1>Review</h1><button class="link" data-act="leave">Done</button></header><section class="panel"><h2>All caught up</h2><p class="muted">You reviewed '+(R?R.count:0)+' cards. They will come back when they are due.</p><div class="row"><button class="btn" data-act="leave">Back</button></div></section>';
  var pair=R.q[R.i], s=byId(pair[0]), c=s&&s.cards.filter(function(x){return x.id===pair[1]})[0];
  if(!c){R.i++;return vReview()}
  var now=Date.now();
  var rate=R.shown?'<div class="rate">'+['Again','Hard','Good','Easy'].map(function(l,r){return '<button data-act="rate" data-r="'+r+'">'+l+'<small>'+fmt(sched(c,r).due-now)+'</small></button>'}).join('')+'</div>':'<div class="row"><button class="btn" data-act="flip" style="width:100%">Show answer</button></div>';
  return '<header class="top"><h1>Review</h1><button class="link" data-act="leave">Stop</button></header>'+
  '<div class="muted small mono">'+(R.i+1)+' of '+R.q.length+' · '+esc(cut(s.title,28))+'</div><div class="bar"><i style="width:'+(R.i/R.q.length*100)+'%"></i></div>'+
  '<section class="panel flash" data-act="flip"><div>'+esc(c.q)+(R.shown?'<div class="a" style="margin-top:14px">'+esc(c.a)+'</div>':'')+'</div></section>'+rate;
}
function render(keep){
  clearInterval(timerId);
  if(V.name!=='new')stopRec();
  var a=$('#app'); if(!a)return;
  a.innerHTML=({home:vHome,new:vNew,set:vSet,review:vReview,welcome:vWelcome,auth:vAuth,loading:vLoading,setup:vSetup,loaderr:vLoadErr})[V.name]();var ar=$('#arate');if(ar)ar.value=String(AU.rate);
  renderStatus();
  if(V.name==='set'&&V.tab==='match'&&M&&M.start&&!M.done){timerId=setInterval(function(){var e=$('#mtime');if(e)e.textContent=((Date.now()-M.start)/1000).toFixed(1)+'s'},200)}
  if(!keep)window.scrollTo(0,0);
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  var d=b.dataset, s=byId(V.setId), a=d.act;
  if(a==='home'||a==='open'||(a==='tab'&&d.tab!=='audio'))stopAudio();
  if(a==='home'){V={name:'home'};Z=null;M=null;render()}
  else if(a==='new'){V={name:'new'};pendingImg=null;render()}
  else if(a==='open'){V={name:'set',setId:d.id,tab:'cards'};Z=null;M=null;render()}
  else if(a==='tab'){V.tab=d.tab;V.confirmDel=false;render()}
  else if(a==='gen'){stopRec();onGen(true)}
  else if(a==='blank')onGen(false);
  else if(a==='stop'){if(ctl)ctl.abort()}
  else if(a==='audiogen'&&s)genAudio(s);
  else if(a==='aplay'&&s&&s.audio){var resume=AU.sid===s.id&&AU.paused;stopAudio();AU.sid=s.id;AU.segs=segsOf(s.audio);if(!resume)AU.idx=0;AU.playing=true;AU.paused=false;var rt=$('#arate');if(rt)AU.rate=+rt.value;render(true);setTimeout(function(){speakFrom(AU.idx)},80)}
  else if(a==='apause'){AU.token++;try{window.speechSynthesis.cancel()}catch(x){}AU.playing=false;AU.paused=true;render(true)}
  else if(a==='astop'){stopAudio();AU.idx=0;render(true)}
  else if(a==='welcomesave')saveProfile();
  else if(a==='resetstyle'){var ps=$('#ps');if(ps)ps.value=defStyle()}
  else if(a==='authmode'){AUTH=d.m;authMsg=null;render()}
  else if(a==='retryload'){enter()}
  else if(a==='rec'){if(recOn)stopRec();else startRec()}
  else if(a==='logout'){stopAudio();stopRec();flush().then(function(){if(syncState==='synced'){try{localStorage.removeItem(LS)}catch(x){}}return sb.auth.signOut()})}
  else if(a==='editprofile'){V={name:'welcome'};render()}
  else if(a==='morecards'&&s)moreCards(s);
  else if(a==='newquiz'&&s)newQuiz(s);
  else if(a==='delask'){V.confirmDel=true;render()}
  else if(a==='canceldel'){V.confirmDel=false;render()}
  else if(a==='delset'&&s){S.sets=S.sets.filter(function(x){return x.id!==s.id});persist();V={name:'home'};render()}
  else if(a==='addcard'&&s){var q=($('#cq').value||'').trim(),an=($('#ca').value||'').trim();if(q&&an){s.cards.unshift(newCard(q.slice(0,300),an.slice(0,500)));persist();render()}}
  else if(a==='delcard'&&s){s.cards=s.cards.filter(function(c){return c.id!==d.id});persist();render()}
  else if(a==='reviewall')startReview(null);
  else if(a==='reviewset')startReview(V.setId);
  else if(a==='flip'&&R){R.shown=true;render()}
  else if(a==='rate'&&R){
    var pair=R.q[R.i], rs=byId(pair[0]), c=rs.cards.filter(function(x){return x.id===pair[1]})[0], r=+d.r;
    Object.assign(c,sched(c,r)); markStudied(1); R.count++; if(r===0)R.q.push(pair);
    R.i++; R.shown=false; persist(); render();
  }
  else if(a==='leave'){V=R&&R.scope?{name:'set',setId:R.scope,tab:'cards'}:{name:'home'};R=null;render()}
  else if(a==='pick'&&s&&Z&&Z.picked===null){var q2=s.quiz[Z.i];Z.picked=Z.perm[+d.i];if(Z.picked===q2.answer)Z.score++;render()}
  else if(a==='qnext'&&s&&Z){Z.i++;Z.picked=null;if(Z.i>=s.quiz.length){Z.done=true;var pct=Math.round(Z.score/s.quiz.length*100);s.best.quiz=Math.max(s.best.quiz||0,pct);markStudied(s.quiz.length);persist()}else Z.perm=permFor();render()}
  else if(a==='quizagain'){Z=null;render()}
  else if(a==='chip'){sendTutor(d.t)}
  else if(a==='tsend'){var t=$('#tin');if(t&&t.value.trim()){var v=t.value;sendTutor(v)}}
  else if(a==='mstart'&&s){
    var pick=shuffle(s.cards).slice(0,6), tiles=[];
    pick.forEach(function(c){tiles.push({pid:c.id,t:cut(c.q,70)},{pid:c.id,t:cut(c.a,70)})});
    M={sid:s.id,tiles:shuffle(tiles),sel:null,matched:new Set(),wrong:null,lock:false,start:0,end:0,done:false};render();
  }
  else if(a==='tile'&&s&&M){
    var i=+d.i; if(M.lock||M.done||M.matched.has(i))return;
    if(!M.start)M.start=Date.now();
    if(M.sel===null)M.sel=i;
    else if(M.sel===i)M.sel=null;
    else{
      var x=M.tiles[M.sel], y=M.tiles[i];
      if(x.pid===y.pid){M.matched.add(M.sel);M.matched.add(i);M.sel=null;
        if(M.matched.size===M.tiles.length){M.done=true;M.end=Date.now();var t2=M.end-M.start;s.best.match=s.best.match?Math.min(s.best.match,t2):t2;markStudied(M.tiles.length/2);persist()}}
      else{M.wrong=[M.sel,i];M.sel=null;M.lock=true;render();setTimeout(function(){if(M){M.wrong=null;M.lock=false;if(V.name==='set'&&V.tab==='match')render()}},550);return}
    }
    render();
  }
});
function startReview(scope){
  var n=Date.now(),q=[];
  S.sets.forEach(function(s){if(scope&&s.id!==scope)return;s.cards.forEach(function(c){if(c.due<=n)q.push([s.id,c.id])})});
  R={q:shuffle(q),i:0,shown:false,scope:scope,count:0};V={name:'review'};render();
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
var PDFB='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function readPdf(file){
  var p=window.pdfjsLib?Promise.resolve():loadScript(PDFB+'pdf.min.js').then(function(){return loadScript(PDFB+'pdf.worker.min.js')});
  return p.then(function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFB+'pdf.worker.min.js';return file.arrayBuffer()}).then(function(buf){return window.pdfjsLib.getDocument({data:buf}).promise}).then(function(doc){
    var n=Math.min(doc.numPages,80),out='',i=1;
    function next(){if(i>n||out.length>40000)return Promise.resolve(out);return doc.getPage(i++).then(function(pg){return pg.getTextContent()}).then(function(tc){out+=tc.items.map(function(x){return x.str}).join(' ')+'\n\n';return next()})}
    return next();
  });
}
function cleanSubs(t){return t.replace(/\r/g,'').split('\n').filter(function(l){l=l.trim();return l&&!/^WEBVTT/.test(l)&&!/^\d+$/.test(l)&&!/-->/.test(l)&&!/^(NOTE|Kind:|Language:)/.test(l)}).map(function(l){return l.replace(/<[^>]+>/g,'')}).join(' ')}
function addText(t,label,name){var n=$('#nn'),nm=$('#fname');if(n)n.value=(n.value?n.value+'\n\n':'')+t.slice(0,30000);if(nm)nm.textContent=label+': '+name}
var REC=null, recOn=false, wake=null;
function recSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function recLabel(){var b=$('#recbtn');if(b){b.textContent=recOn?'Stop recording':'Record a lecture';b.classList.toggle('danger',recOn)}var n=$('#recnote');if(n&&recOn)n.textContent='Listening. Keep the screen on and the phone close to the speaker.';else if(n&&!n.dataset.keep)n.textContent=''}
function stopRec(){recOn=false;var r=REC;REC=null;if(r){try{r.stop()}catch(e){}}if(wake){try{wake.release()}catch(e){}wake=null}recLabel()}
function startRec(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, ta=$('#nn'); if(!SR||recOn||!ta)return;
  var base=ta.value, finalT='', r=new SR();
  var radio=document.querySelector('input[name=nmode][value=lecture]'); if(radio)radio.checked=true;
  r.continuous=true; r.interimResults=true; r.lang=navigator.language||'en-GB';
  r.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var x=e.results[i];if(x.isFinal)finalT+=x[0].transcript.trim()+' ';else interim+=x[0].transcript}var t=$('#nn');if(t)t.value=(base?base+'\n\n':'')+finalT+interim};
  r.onend=function(){if(recOn&&REC===r){try{r.start()}catch(e){}}};
  r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopRec();var n=$('#recnote');if(n){n.dataset.keep='1';n.textContent='Microphone access was blocked. Allow it in your browser settings and try again.'}}};
  REC=r; recOn=true;
  try{r.start()}catch(e){stopRec();return}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}
  var n2=$('#recnote');if(n2)delete n2.dataset.keep;
  recLabel();
}
var noteTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id==='notes'){var s=byId(V.setId);if(!s)return;s.notes=e.target.value.slice(0,20000);clearTimeout(noteTimer);noteTimer=setTimeout(persist,700)}
});
document.addEventListener('change',function(e){
  if(e.target.id==='arate'){AU.rate=+e.target.value;return}
  if(e.target.id!=='nf')return;
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var nm=$('#fname');
  if(/^image\//.test(f.type)){pendingImg=f;if(nm)nm.textContent='Photo added: '+f.name}
  else if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){if(nm)nm.textContent='Reading PDF…';readPdf(f).then(function(t){if(t.replace(/\s/g,'').length<80){if(nm)nm.textContent='No text found. This PDF may be scanned. Add photos of the pages instead.';return}addText(t,'PDF added',f.name)}).catch(function(){if(nm)nm.textContent='Could not read that PDF. Try copying the text instead.'})}
  else{f.text().then(function(t){if(/\.(vtt|srt)$/i.test(f.name))t=cleanSubs(t);addText(t,'Added',f.name)}).catch(function(){if(nm)nm.textContent='Could not read that file.'})}
});

/* ---------- boot ---------- */
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='authform'){e.preventDefault();doAuth()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(saveTimer);flush()}});
render();
fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(cfg){
  if(!cfg||!cfg.url||!cfg.anon||!window.supabase){V={name:'setup'};render();return}
  sb=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){handleSession(session,ev)},0)});
}).catch(function(){V={name:'setup'};render()});

})();
</script>
