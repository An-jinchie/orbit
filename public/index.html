<title>Orbit</title>

<style>
/* White, airy layout: sidebar on laptops, bottom bar on phones. Big readable type. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f7fb; --ink:#101828; --muted:#5a6477; --line:#e4e7ee;
  --hema:#4361ee; --on-hema:#ffffff; --eosin:#f97316; --ok:#16a34a; --bad:#dc2626; --tint:#eef1ff;
  --display:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Inter",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#161b25; --soft:#121722; --ink:#eef1f7; --muted:#9aa4b8; --line:#273044;
  --hema:#8aa0ff; --on-hema:#0d1117; --eosin:#fb923c; --ok:#4ade80; --bad:#f87171; --tint:#1d2540; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b25; --soft:#121722; --ink:#eef1f7; --muted:#9aa4b8; --line:#273044;
  --hema:#8aa0ff; --on-hema:#0d1117; --eosin:#fb923c; --ok:#4ade80; --bad:#f87171; --tint:#1d2540; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
#app.solo{max-width:480px;margin-inline:auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:20px}
#app.shell{min-height:100vh}
.main{display:flex;flex-direction:column;gap:22px;padding:22px 18px 110px;max-width:980px;width:100%;margin-inline:auto;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:32px;font-weight:800} h2{font-size:24px;font-weight:700} h3{font-size:19px;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--hema) 45%,transparent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mono{font-variant-numeric:tabular-nums}
.pill{font:600 14px var(--body);background:var(--soft);border-radius:99px;padding:6px 13px;color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--tint);color:var(--hema)}
.pill.fire{background:color-mix(in srgb,var(--eosin) 14%,transparent);color:var(--eosin)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--hema);color:var(--on-hema);border:1px solid var(--hema);border-radius:14px;padding:12px 22px;font-weight:600;font-size:16px;min-height:50px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);color:var(--hema);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:42px;padding:8px 16px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--hema);padding:8px 0;font-weight:600;font-size:16px;text-align:left}
label{font-weight:600;font-size:16px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font-size:17px}
input:focus,textarea:focus,select:focus{border-color:var(--hema);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--hema) 15%,transparent)}
select{width:auto}
textarea{resize:vertical;min-height:140px;line-height:1.5}
input[type=file]{font-size:15px;max-width:100%}
.field{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)} .small{font-size:15px}
.big{font:800 48px/1 var(--display)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;width:100%;text-align:left;min-width:0;box-shadow:var(--shadow)}
.item:hover{border-color:var(--hema)}
.item>div{min-width:0}
.item .t{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tag{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;background:var(--tint);color:var(--hema);border-radius:6px;padding:3px 7px;margin-left:8px;vertical-align:2px}
.week{display:flex;gap:10px;align-items:flex-end;height:90px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.week i{display:block;width:100%;background:var(--hema);border-radius:6px 6px 0 0;min-height:4px}
.week i.zero{background:var(--line)}
.week span{font:600 13px var(--body);color:var(--muted)}
.tools{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--soft);border:1.5px solid transparent;border-radius:99px;padding:10px 18px;font-weight:600;font-size:16px;color:var(--ink)}
.tools button[aria-selected=true]{background:var(--tint);color:var(--hema);border-color:var(--hema)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.prose{font-size:17px;line-height:1.65}
.prose p{margin-bottom:10px} .prose ul{margin:0 0 10px;padding-left:22px} .prose li{margin-bottom:5px}
.flash{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 26px/1.35 var(--display);padding:32px 22px;cursor:pointer;overflow-wrap:anywhere;user-select:none}
.flash.static{cursor:default;min-height:170px}
.flash .a{color:var(--hema)}
.flash .lbl{display:block;font:600 14px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hema);border-radius:6px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rate button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 2px;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px}
.rate button:hover{border-color:var(--hema);background:var(--tint)}
.rate small{font:500 14px var(--body);color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:17px;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--hema);background:var(--tint)}
.opt b{font:700 15px var(--body);color:var(--hema);background:var(--tint);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt[disabled]{color:inherit}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{padding:13px 16px;border-radius:18px;max-width:92%;overflow-wrap:anywhere;font-size:17px}
.bub.u{align-self:flex-end;background:var(--hema);color:var(--on-hema);border-bottom-right-radius:6px}
.bub.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.bub p:last-child,.bub ul:last-child{margin-bottom:0}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--tint);color:var(--hema);border:0;border-radius:99px;padding:10px 16px;font-weight:600;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:96px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px;font-size:15px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.tile.sel{border-color:var(--hema);background:var(--tint)}
.tile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.tile.done{visibility:hidden}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:14px;padding:12px 16px;font-size:16px}
.err{color:var(--bad);font-size:16px}
.okmsg{color:var(--ok);font-size:16px}
.authform{display:flex;flex-direction:column;gap:16px}
.radio{display:flex;gap:18px;flex-wrap:wrap}
.radio label{display:flex;gap:8px;align-items:center;font-weight:500}
.radio input{width:20px;height:20px;accent-color:var(--hema)}
.script{max-height:280px;overflow:auto;border-radius:14px;padding:14px 16px;background:var(--soft)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cardrow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cardrow>div{min-width:0;overflow-wrap:anywhere}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero p{font-size:18px}
.tilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ct{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ct:hover{border-color:var(--hema);transform:translateY(-2px)}
.ct .bub2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.ct .bub2 .ic{width:24px;height:24px}
.ct b{font:700 18px var(--display);display:block}
.ct span.s{color:var(--muted);font-size:15px;line-height:1.35}
.k1 .bub2{background:#e8edff;color:#4361ee}.k2 .bub2{background:#ffe9e0;color:#f0561f}.k3 .bub2{background:#e1f6ea;color:#15965a}.k4 .bub2{background:#f3e8ff;color:#9333ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k1 .bub2{background:#1d2540}:root:not([data-theme="light"]) .k2 .bub2{background:#3a2218}:root:not([data-theme="light"]) .k3 .bub2{background:#16301f}:root:not([data-theme="light"]) .k4 .bub2{background:#2b1e40}}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gstats div{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.gstats small{display:block;color:var(--muted);font-weight:600;font-size:14px}
.gstats b{font:800 28px var(--display)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;font-weight:700;font-size:20px;padding:20px}
.gcard{align-items:flex-start}
.nav{position:fixed;z-index:5;background:var(--surface);display:flex;border-top:1px solid var(--line);left:0;right:0;bottom:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav .brandrow,.nav .navfoot{display:none}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:12px;min-width:60px}
.nav button[aria-current=page]{color:var(--hema)}
.nav button.mk{color:var(--on-hema)}
.nav button.mk span.plus{background:var(--hema);width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px color-mix(in srgb,var(--hema) 40%,transparent)}
.nav button.mk{color:var(--hema)}
.nav button.mk span.plus .ic{stroke:var(--on-hema)}
@media (min-width:900px){
  #app.shell{display:grid;grid-template-columns:260px 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);background:var(--soft);padding:22px 14px}
  .nav .brandrow{display:flex;align-items:center;gap:10px;font:800 24px var(--display);padding:4px 12px 20px}
  .nav button{flex-direction:row;gap:14px;font-size:17px;padding:13px 14px;min-width:0;width:100%;text-align:left;color:var(--ink)}
  .nav button[aria-current=page]{background:var(--surface);color:var(--hema);box-shadow:var(--shadow)}
  .nav button.mk{background:var(--hema);color:var(--on-hema);justify-content:center;margin-bottom:8px;font-size:17px}
  .nav button.mk span.plus{background:none;width:auto;height:auto;margin:0;box-shadow:none;display:inline-flex}
  .nav button.mk span.plus .ic{stroke:var(--on-hema)}
  .nav .navfoot{display:block;margin-top:auto;padding:12px;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
  .main{padding:36px 40px 60px}
  .tilegrid{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}.ct{transition:transform .15s,border-color .15s}}
</style>

function newCard(q,a){return {id:uid(),q:q,a:a,due:0,s:0,d:0,last:0,reps:0,lapses:0}}

/* ---------- state ---------- */
function seed(){

function load(){try{var t=localStorage.getItem(LS);if(t){var d=JSON.parse(t);if(d&&Array.isArray(d.sets))return d}}catch(e){}return null}

var DEFAULT_STYLE='Explain things clearly in plain English. Start with the answer, then give the reasoning with a concrete example. Keep answers short. Quiz me or ask me to explain it back when I ask. Be precise about what is known and what is not, and never inflate.', PREFILL=null;

  touched=true; if(S)S.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!sb||!user||!cloudReady)return; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
function flush(){
  if(!sb||!user||!cloudReady||!dirty)return Promise.resolve();
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return Promise.resolve()}
  saving=true;dirty=false;
  var row={user_id:user.id,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()};
  return sb.from('libraries').upsert(row).then(function(r){return r&&r.error?Promise.reject(r.error):null}).then(function(){syncState='synced'},function(){syncState='error';dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,8000)}).then(function(){saving=false;renderStatus();if(dirty&&syncState==='synced'){clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}});
}
function renderStatus(){
  var el=$('#sync'); if(!el)return;
  el.textContent=syncState==='synced'?'Saved to your account':syncState==='error'?'Could not sync. Retrying. Your changes are kept on this device.':'Saving…';
}
function loadLibrary(){
  syncState='local';cloudReady=false;
  return sb.from('libraries').select('data').eq('user_id',user.id).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    var cloud=(r.data&&r.data.data&&Array.isArray(r.data.data.sets))?r.data.data:null, local=load(), pick=cloud;
    if(local&&(!cloud||(local.savedAt||0)>(cloud.savedAt||0)))pick=local;
    S=norm(pick||seed()); cloudReady=true;
    if(!S.savedAt)S.savedAt=Date.now();
    syncState=(cloud&&pick===cloud)?'synced':'local';
    if(pick!==cloud){dirty=true;flush()}
  });
}

function handleSession(session,ev){

function aiErr(e){var c=e&&e.code;return ({session_expired:'Your session ended. Log in again.',rate_limited:'You have reached today’s AI limit. It resets at midnight UTC.',provider_busy:'The AI service is busy. Wait a minute and try again.',not_configured:'AI is not set up on this site yet. Check the Vercel settings.',prompt_too_large:'That is too much text at once. Try a shorter section.',invalid_json:'The AI’s reply could not be read. Try again.',refused:'The AI could not work with that input. Try different notes.',empty_completion:'The AI returned nothing. Try again.',image_rejected:'That image could not be used. Try a clearer photo.',network:'Could not reach the server. Check your connection.',timeout:'That took too long. Try a shorter section of the document.',bad_key:'The AI key on this site is wrong. Check GEMINI_API_KEY in Vercel.'})[c]||('The AI hit an error.'+(e&&e.detail?' ('+e.detail+')':' Try again.'))}
function persona(){var p=S&&S.profile;return (p&&p.style!=null)?p.style:defStyle()}
function shrinkImage(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]})};im.onerror=function(){URL.revokeObjectURL(u);rej({code:'image_rejected'})};im.src=u})}
function callAI(messages,o){
  o=o||{};
  return sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session; if(!s)throw {code:'session_expired'};
    return (o.image?shrinkImage(o.image):Promise.resolve(null)).then(function(img){
      var p=(S&&S.profile)||{};
      return fetch('/api/ai',{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({mode:o.json?'json':'text',messages:messages,persona:persona(),profile:{name:p.name,course:p.course},image:img})});
    });
  }).then(function(res){
    return res.json().catch(function(){return null}).then(function(b){if(!b){if(!res.ok)throw {code:res.status===504||res.status===502?'timeout':'upstream_error',detail:'HTTP '+res.status};throw {code:'invalid_json'}}if(!res.ok)throw {code:b.error||'upstream_error',detail:b.detail};return b.text});
  }).catch(function(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    if(e&&e.code)throw e;
    throw {code:'network'};
  });
}
function parseJSONLoose(t){
  var s=String(t).trim(), f=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(f)s=f[1].trim();
  try{return JSON.parse(s)}catch(e){}
  var a=s.search(/[\[{]/), z=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
  if(a>-1&&z>a){try{return JSON.parse(s.slice(a,z+1))}catch(e){}}
  throw {code:'invalid_json'};
}
function callJSON(prompt,extra){
  ctl=new AbortController(); status('Thinking…',true);
  return callAI([{role:'user',content:prompt}],{json:true,signal:ctl.signal,image:extra&&extra.images}).then(function(t){ctl=null;return parseJSONLoose(t)},function(e){ctl=null;throw e});
}
function cleanCards(a){return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x.q==='string'&&typeof x.a==='string'&&x.q.trim()&&x.a.trim()}).slice(0,40).map(function(x){return newCard(x.q.trim().slice(0,300),x.a.trim().slice(0,500))})}
function cleanQuiz(a){return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x.q==='string'&&Array.isArray(x.options)&&x.options.length===4&&x.options.every(function(o){return typeof o==='string'})&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4}).slice(0,20).map(function(x){return {q:x.q.slice(0,300),options:x.options.map(function(o){return o.slice(0,200)}),answer:x.answer,why:String(x.why||'').slice(0,300)}})}

function onGen(withAI){
  var title=($('#nt').value||'').trim(), text=($('#nn').value||'').trim().slice(0,30000), lecture=(document.querySelector('input[name=nmode]:checked')||{}).value==='lecture';
  if(!withAI){
    if(!title&&!text){status('Add a title or some notes first.');return}
    var s={id:uid(),title:title||'Untitled set',created:Date.now(),summary:'',notes:text,cards:[],quiz:[],best:{}};
    S.sets.unshift(s);persist();V={name:'set',setId:s.id,tab:'cards'};render();return;
  }
  if(!text&&!pendingImg){status('Paste some notes or add a file first.');return}
  var prompt='You are building study material for a university student. '+(text?'Use the notes below.':'The notes are in the attached image; read them first.')+(lecture?' The text is a raw lecture transcript with filler words and possible transcription errors, so first tidy it into organised study notes.':'')+' Use only what the notes say and do not invent facts.\nReply with only one JSON object:\n{"title": "short set title, at most 6 words", "summary": "clear study notes in plain text, short lines starting with \\"- \\", at most 300 words", "cards": [ '+CARD_SHAPE+' ] (12 to 20 flashcards, one idea each), "quiz": [ '+QUIZ_SHAPE+' ] (8 multiple-choice questions)}\n'+(text?'\nNotes:\n'+text.slice(0,30000):'');
  var extra=pendingImg?{images:pendingImg}:{};

    var cards=cleanCards(r&&r.cards), quiz=cleanQuiz(r&&r.quiz);
    if(!cards.length&&!quiz.length){status('');$('#aistatus').innerHTML='<p class="err">Claude did not return usable cards. Try again with more detailed notes.</p>';return}
    var s={id:uid(),title:title||String((r&&r.title)||'New set').slice(0,60),created:Date.now(),summary:String((r&&r.summary)||'').slice(0,3000),notes:text,cards:cards,quiz:quiz,best:{}};
    S.sets.unshift(s);pendingImg=null;persist();V={name:'set',setId:s.id,tab:'cards'};render();
  }).catch(function(e){if(e&&e.code==='cancelled'){status('Stopped.');return}status('');var el=$('#aistatus');if(el)el.innerHTML='<p class="err">'+esc(aiErr(e))+'</p>'});

  callJSON(p).then(function(r){var n=cleanCards(r);s.cards=s.cards.concat(n);persist();status(n.length+' cards added.');}).catch(function(e){if(e&&e.code==='cancelled'){status('Stopped.');return}status('');var el=$('#aistatus');if(el)el.innerHTML='<p class="err">'+esc(aiErr(e))+'</p>'});
}

  callJSON(p).then(function(r){var q=cleanQuiz(r);if(!q.length){status('');$('#aistatus').innerHTML='<p class="err">No usable questions came back. Try again.</p>';return}s.quiz=q;Z=null;persist();status(q.length+' questions ready. Open the Quiz tab.')}).catch(function(e){if(e&&e.code==='cancelled'){status('Stopped.');return}status('');var el=$('#aistatus');if(el)el.innerHTML='<p class="err">'+esc(aiErr(e))+'</p>'});
}
function sendTutor(text){
  var s=byId(V.setId); if(!s||!text.trim())return;
  var h=T[s.id]=T[s.id]||[];
  h.push({role:'user',content:text});
  var rules='You are a patient study tutor for a university student. Answer using the student’s notes below. If something is not in the notes, say so, then give a short general explanation and label it as outside the notes. Keep answers short and concrete, in short paragraphs or lines starting with "- ". If asked to quiz the student, ask one question at a time and wait for the answer.\n\nSet: '+s.title+'\n\nNotes:\n'+(s.notes||s.summary||'(no notes yet)').slice(0,12000);
  var turns=[{role:'user',content:rules}].concat(h.slice(-12));
  ctl=new AbortController(); render(); status('Thinking…',true);
  callAI(turns,{signal:ctl.signal}).then(function(t){h.push({role:'assistant',content:t});ctl=null;render()}).catch(function(e){
    ctl=null;
    if(!(e&&e.code==='cancelled'))h.push({role:'assistant',content:aiErr(e)});

  if(!c){R.i++;return vReview()}
  var now=Date.now();
  var rate=R.shown?'<div class="rate">'+['Again','Hard','Good','Easy'].map(function(l,r){return '<button data-act="rate" data-r="'+r+'">'+l+'<small>'+fmt(sched(c,r).due-now)+'</small></button>'}).join('')+'</div>':'<div class="row"><button class="btn" data-act="flip" style="width:100%">Show answer</button></div>';
  return '<header class="top"><h1>Review</h1><button class="link" data-act="leave">Stop</button></header>'+
  '<div class="muted small mono">'+(R.i+1)+' of '+R.q.length+' · '+esc(cut(s.title,28))+'</div><div class="bar"><i style="width:'+(R.i/R.q.length*100)+'%"></i></div>'+
  '<section class="panel flash" data-act="flip"><div>'+esc(c.q)+(R.shown?'<div class="a" style="margin-top:14px">'+esc(c.a)+'</div>':'')+'</div></section>'+rate;
}
function render(keep){
  clearInterval(timerId);
  if(V.name!=='new')stopRec();
  var a=$('#app'); if(!a)return;
  var shell=({home:1,new:1,set:1,library:1,arcade:1,me:1})[V.name];
  a.className=shell?'shell':'solo';
  var inner=({home:vHome,new:vNew,set:vSet,library:vLibrary,arcade:vArcade,me:vMe,review:vReview,welcome:vWelcome,auth:vAuth,loading:vLoading,setup:vSetup,loaderr:vLoadErr})[V.name]();
  a.innerHTML=shell?nav()+'<main class="main">'+inner+'</main>':inner;var ar=$('#arate');if(ar)ar.value=String(AU.rate);
  renderStatus();
  if(V.name==='set'&&V.tab==='arcade'){
    if(M&&M.start&&!M.done)timerId=setInterval(function(){var e=$('#mtime');if(e)e.textContent=((Date.now()-M.start)/1000).toFixed(1)+'s'},200);
    else if(G&&!G.done)timerId=setInterval(function(){var l=G.end-Date.now();if(l<=0){clearInterval(timerId);endGame();return}var e=$('#gtime');if(e)e.textContent=Math.ceil(l/1000)+'s'},200);
  }
  if(!keep)window.scrollTo(0,0);
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  var d=b.dataset, s=byId(V.setId), a=d.act;
  if(a==='home'||a==='open'||a==='go'||a==='play'||a==='new'||a==='newrec'||(a==='tab'&&d.tab!=='audio'))stopAudio();
  if(a==='home'){V={name:'home'};Z=null;M=null;G=null;render()}
  else if(a==='go'){V={name:d.v};Z=null;M=null;G=null;if(d.v==='new')pendingImg=null;render()}
  else if(a==='new'){V={name:'new'};pendingImg=null;render()}
  else if(a==='newrec'){V={name:'new'};pendingImg=null;render();startRec()}
  else if(a==='open'){V={name:'set',setId:d.id,tab:'cards'};Z=null;M=null;G=null;render()}
  else if(a==='play'){V={name:'set',setId:d.id,tab:'arcade'};Z=null;M=null;G=null;render()}
  else if(a==='tab'){V.tab=d.tab;V.confirmDel=false;G=null;M=null;render()}
  else if(a==='gmenu'){G=null;M=null;render()}
  else if(a==='gstart'&&s){if(d.g==='match')startMatch(s);else startGame(s,d.g);render()}
  else if(a==='gans'&&s&&G&&!G.lock&&!G.done){
    var gq=G.cur,gp=+d.i,gok=G.kind==='speed'?gp===gq.ok:(gp===1)===gq.truth;
    G.answered++;
    if(gok){G.right++;G.score+=10+Math.min(G.streak,5)*2;G.streak++}
    else{G.streak=0;if(!G.missed[gq.c.id]){G.missed[gq.c.id]=1;gq.c.due=Math.min(gq.c.due,Date.now())}}
    G.fb={pick:gp,ok:gok};G.lock=true;render(true);
    var g0=G;setTimeout(function(){if(G!==g0||G.done)return;G.fb=null;G.lock=false;G.cur=mkQ(byId(G.sid));if(V.name==='set'&&V.tab==='arcade')render(true)},gok?450:1100);
  }
  else if(a==='gen'){stopRec();onGen(true)}
  else if(a==='blank')onGen(false);
  else if(a==='stop'){if(ctl)ctl.abort()}
  else if(a==='audiogen'&&s)genAudio(s);
  else if(a==='aplay'&&s&&s.audio){var resume=AU.sid===s.id&&AU.paused;stopAudio();AU.sid=s.id;AU.segs=segsOf(s.audio);if(!resume)AU.idx=0;AU.playing=true;AU.paused=false;var rt=$('#arate');if(rt)AU.rate=+rt.value;render(true);setTimeout(function(){speakFrom(AU.idx)},80)}
  else if(a==='apause'){AU.token++;try{window.speechSynthesis.cancel()}catch(x){}AU.playing=false;AU.paused=true;render(true)}
  else if(a==='astop'){stopAudio();AU.idx=0;render(true)}
  else if(a==='welcomesave')saveProfile();
  else if(a==='resetstyle'){var ps=$('#ps');if(ps)ps.value=defStyle()}
  else if(a==='authmode'){AUTH=d.m;authMsg=null;render()}
  else if(a==='retryload'){enter()}
  else if(a==='rec'){if(recOn)stopRec();else startRec()}
  else if(a==='logout'){stopAudio();stopRec();flush().then(function(){if(syncState==='synced'){try{localStorage.removeItem(LS)}catch(x){}}return sb.auth.signOut()})}
  else if(a==='editprofile'){V={name:'welcome'};render()}
  else if(a==='morecards'&&s)moreCards(s);
  else if(a==='newquiz'&&s)newQuiz(s);
  else if(a==='delask'){V.confirmDel=true;render()}
  else if(a==='canceldel'){V.confirmDel=false;render()}
  else if(a==='delset'&&s){S.sets=S.sets.filter(function(x){return x.id!==s.id});persist();V={name:'home'};render()}
  else if(a==='addcard'&&s){var q=($('#cq').value||'').trim(),an=($('#ca').value||'').trim();if(q&&an){s.cards.unshift(newCard(q.slice(0,300),an.slice(0,500)));persist();render()}}
  else if(a==='delcard'&&s){s.cards=s.cards.filter(function(c){return c.id!==d.id});persist();render()}
  else if(a==='reviewall')startReview(null);
  else if(a==='reviewset')startReview(V.setId);
  else if(a==='flip'&&R){R.shown=true;render()}
  else if(a==='rate'&&R){
    var pair=R.q[R.i], rs=byId(pair[0]), c=rs.cards.filter(function(x){return x.id===pair[1]})[0], r=+d.r;
    Object.assign(c,sched(c,r)); markStudied(1); R.count++; if(r===0)R.q.push(pair);
    R.i++; R.shown=false; persist(); render();
  }
  else if(a==='leave'){V=R&&R.scope?{name:'set',setId:R.scope,tab:'cards'}:{name:'home'};R=null;render()}
  else if(a==='pick'&&s&&Z&&Z.picked===null){var q2=s.quiz[Z.i];Z.picked=Z.perm[+d.i];if(Z.picked===q2.answer)Z.score++;render()}
  else if(a==='qnext'&&s&&Z){Z.i++;Z.picked=null;if(Z.i>=s.quiz.length){Z.done=true;var pct=Math.round(Z.score/s.quiz.length*100);s.best.quiz=Math.max(s.best.quiz||0,pct);markStudied(s.quiz.length);persist()}else Z.perm=permFor();render()}
  else if(a==='quizagain'){Z=null;render()}
  else if(a==='chip'){sendTutor(d.t)}
  else if(a==='tsend'){var t=$('#tin');if(t&&t.value.trim()){var v=t.value;sendTutor(v)}}
  else if(a==='mstart'&&s){startMatch(s);render()}
  else if(a==='tile'&&s&&M){
    var i=+d.i; if(M.lock||M.done||M.matched.has(i))return;
    if(!M.start)M.start=Date.now();
    if(M.sel===null)M.sel=i;
    else if(M.sel===i)M.sel=null;
    else{
      var x=M.tiles[M.sel], y=M.tiles[i];
      if(x.pid===y.pid){M.matched.add(M.sel);M.matched.add(i);M.sel=null;
        if(M.matched.size===M.tiles.length){M.done=true;M.end=Date.now();var t2=M.end-M.start;s.best.match=s.best.match?Math.min(s.best.match,t2):t2;markStudied(M.tiles.length/2);persist()}}
      else{M.wrong=[M.sel,i];M.sel=null;M.lock=true;render();setTimeout(function(){if(M){M.wrong=null;M.lock=false;if(V.name==='set'&&V.tab==='arcade')render()}},550);return}
    }
    render();
  }
});
function startReview(scope){
  var n=Date.now(),q=[];
  S.sets.forEach(function(s){if(scope&&s.id!==scope)return;s.cards.forEach(function(c){if(c.due<=n)q.push([s.id,c.id])})});
  R={q:shuffle(q),i:0,shown:false,scope:scope,count:0};V={name:'review'};render();
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
var PDFB='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function readPdf(file){
  var p=window.pdfjsLib?Promise.resolve():loadScript(PDFB+'pdf.min.js').then(function(){return loadScript(PDFB+'pdf.worker.min.js')});
  return p.then(function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFB+'pdf.worker.min.js';return file.arrayBuffer()}).then(function(buf){return window.pdfjsLib.getDocument({data:buf}).promise}).then(function(doc){
    var n=Math.min(doc.numPages,80),out='',i=1;
    function next(){if(i>n||out.length>40000)return Promise.resolve(out);return doc.getPage(i++).then(function(pg){return pg.getTextContent()}).then(function(tc){out+=tc.items.map(function(x){return x.str}).join(' ')+'\n\n';return next()})}
    return next();
  });
}
function cleanSubs(t){return t.replace(/\r/g,'').split('\n').filter(function(l){l=l.trim();return l&&!/^WEBVTT/.test(l)&&!/^\d+$/.test(l)&&!/-->/.test(l)&&!/^(NOTE|Kind:|Language:)/.test(l)}).map(function(l){return l.replace(/<[^>]+>/g,'')}).join(' ')}
function addText(t,label,name){var n=$('#nn'),nm=$('#fname');if(n)n.value=(n.value?n.value+'\n\n':'')+t.slice(0,30000);if(nm)nm.textContent=label+': '+name}
var REC=null, recOn=false, wake=null;
function recSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function recLabel(){var b=$('#recbtn');if(b){b.textContent=recOn?'Stop recording':'Record a lecture';b.classList.toggle('danger',recOn)}var n=$('#recnote');if(n&&recOn)n.textContent='Listening. Keep the screen on and the phone close to the speaker.';else if(n&&!n.dataset.keep)n.textContent=''}
function stopRec(){recOn=false;var r=REC;REC=null;if(r){try{r.stop()}catch(e){}}if(wake){try{wake.release()}catch(e){}wake=null}recLabel()}
function startRec(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, ta=$('#nn'); if(!SR||recOn||!ta)return;
  var base=ta.value, finalT='', r=new SR();
  var radio=document.querySelector('input[name=nmode][value=lecture]'); if(radio)radio.checked=true;
  r.continuous=true; r.interimResults=true; r.lang=navigator.language||'en-GB';
  r.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var x=e.results[i];if(x.isFinal)finalT+=x[0].transcript.trim()+' ';else interim+=x[0].transcript}var t=$('#nn');if(t)t.value=(base?base+'\n\n':'')+finalT+interim};
  r.onend=function(){if(recOn&&REC===r){try{r.start()}catch(e){}}};
  r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopRec();var n=$('#recnote');if(n){n.dataset.keep='1';n.textContent='Microphone access was blocked. Allow it in your browser settings and try again.'}}};
  REC=r; recOn=true;
  try{r.start()}catch(e){stopRec();return}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}
  var n2=$('#recnote');if(n2)delete n2.dataset.keep;
  recLabel();
}
var noteTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id==='notes'){var s=byId(V.setId);if(!s)return;s.notes=e.target.value.slice(0,20000);clearTimeout(noteTimer);noteTimer=setTimeout(persist,700)}
});
document.addEventListener('change',function(e){
  if(e.target.id==='arate'){AU.rate=+e.target.value;return}
  if(e.target.id!=='nf')return;
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var nm=$('#fname');
  if(/^image\//.test(f.type)){pendingImg=f;if(nm)nm.textContent='Photo added: '+f.name}
  else if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){if(nm)nm.textContent='Reading PDF…';readPdf(f).then(function(t){if(t.replace(/\s/g,'').length<80){if(nm)nm.textContent='No text found. This PDF may be scanned. Add photos of the pages instead.';return}addText(t,'PDF added',f.name)}).catch(function(){if(nm)nm.textContent='Could not read that PDF. Try copying the text instead.'})}
  else{f.text().then(function(t){if(/\.(vtt|srt)$/i.test(f.name))t=cleanSubs(t);addText(t,'Added',f.name)}).catch(function(){if(nm)nm.textContent='Could not read that file.'})}
});

/* ---------- boot ---------- */
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='authform'){e.preventDefault();doAuth()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(saveTimer);flush()}});
render();
fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json()}).then(function(cfg){
  if(!cfg||!cfg.url||!cfg.anon||!window.supabase){V={name:'setup'};render();return}
  sb=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){handleSession(session,ev)},0)});
}).catch(function(){V={name:'setup'};render()});

})();
